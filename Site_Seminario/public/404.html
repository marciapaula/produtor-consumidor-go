<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>404 — Página não encontrada | CANAL</title>

<link rel="icon" href="./assets/img/favicon.svg" type="image/svg+xml">
<link rel="icon" href="./assets/img/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="./assets/img/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;family=Inter:opsz,wght@14..32,400..600&amp;display=swap">

<link rel="stylesheet" href="./styles/tokens.css">
<link rel="stylesheet" href="./styles/base.css">
<link rel="stylesheet" href="./styles/components.css">

<style>
@layer components {

  .erro {
    min-block-size: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: var(--space-md);
    padding: var(--space-xl) var(--gutter);
    text-align: center;
  }

  .erro-marca {
    font-family: var(--font-display);
    font-size: 1.125rem;
    letter-spacing: -0.02em;
    color: var(--fg-strong);
    text-decoration: none;
  }

  .erro-marca span {
    color: var(--accent);
  }

  /* Ferrugem: a mesma cor semântica de estado inconsistente usada nas
     visualizações de race condition e deadlock. Um 404 é exatamente
     isso — uma rota que não resolveu para um estado válido. */
  .erro-codigo {
    margin: 0;
    font-family: var(--font-mono);
    font-size: var(--fs-display);
    font-weight: 500;
    line-height: 1;
    letter-spacing: var(--tracking-tight);
    color: var(--fault-500);
    text-shadow: 0 0 40px oklch(0.680 0.170 30 / 0.25);
  }

  .erro-tecnico {
    margin: 0;
    font-family: var(--font-mono);
    font-size: var(--fs-small);
    letter-spacing: var(--tracking-wide);
    color: var(--fg-subtle);
  }

  .erro-mensagem {
    max-inline-size: 34ch;
    margin: 0;
    font-family: var(--font-display);
    font-weight: 300;
    font-size: var(--fs-lead);
    line-height: var(--leading-snug);
    color: var(--fg-muted);
  }

  .erro-acao {
    margin-block-start: var(--space-sm);
  }
}
</style>
</head>

<body>

<main class="erro">
  <a class="erro-marca" href="./">CANAL<span>.</span></a>
  <p class="erro-codigo">404</p>
  <p class="erro-tecnico">panic: send on closed channel</p>
  <h1 class="erro-mensagem">A goroutine se perdeu no canal. Nenhum processo consumidor foi encontrado nesta rota.</h1>
  <a class="botao erro-acao" href="./">Restabelecer conexão — voltar ao início</a>
</main>

</body>
</html>
